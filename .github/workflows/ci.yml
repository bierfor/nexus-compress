name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────────────────────
  #  Linux: full pipeline (engine + tests + linting)
  # ─────────────────────────────────────────────────────────────
  linux:
    name: linux · engine + tests + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system deps (Tauri 2 system libs)
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup2.4-dev \
            libjavascriptcoregtk-4.0-dev \
            libavahi-client-dev \
            libsecret-1-dev \
            nodejs npm
        # NB: node + npm come from here so the same Node version is used
        #     for CI. If you prefer a Node manager, swap the line above.

      - name: Install Node 20 (for frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend · install + build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Engine · cargo build --release
        run: cargo build --release --bin nexus --bin p2p_smoke --bin e2e_v3

      - name: Engine · cargo test --release
        run: cargo test --release --bins

      - name: P2P transport · cargo test --bin p2p_smoke
        run: cargo test --release --bin p2p_smoke

      - name: Clippy · lint (warnings reported, not enforced)
        # Sprint 5.6.28: we intentionally do NOT use `-D warnings`
        # because the multiple-bin `#[path]` indirection causes
        # dead_code warnings on items used by another bin. The real
        # safety net is the per-function `#[allow(dead_code)]` we
        # add as we touch each function, and the 149-unit test
        # suite at the next step.
        run: cargo clippy --all-targets --release

      - name: Rustfmt · check
        run: cargo fmt --all -- --check

      - name: Tauri shell · cargo check (no bundle, Linux only)
        run: |
          cd src-tauri
          cargo check --release --bin nexus-rar

  # ─────────────────────────────────────────────────────────────
  #  macOS: builds + signs (release flow lives in `release.yml`)
  #  We do a smaller check here: does the GUI compile & link?
  # ─────────────────────────────────────────────────────────────
  macos-build:
    name: macos · GUI compiles
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/cargo
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend · install + build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Tauri · cargo check (GUI bundle requires codesign;
                                  certs only on release flow)
        run: |
          cd src-tauri
          cargo check --release --bin nexus-rar

  # ─────────────────────────────────────────────────────────────
  #  Windows: builds (signing lives in release flow)
  # ─────────────────────────────────────────────────────────────
  windows-build:
    name: windows · GUI compiles
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Cache cargo + sccache
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\.cargo\registry
            src-tauri\target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend · install + build (PowerShell)
        shell: pwsh
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Tauri · cargo check (GUI bundle requires WIX; signing
                                 only on release flow)
        shell: pwsh
        run: |
          cd src-tauri
          cargo check --release --bin nexus-rar

  # ─────────────────────────────────────────────────────────────
  #  fmt-and-lint: fast overall path indicator on PRs
  # ─────────────────────────────────────────────────────────────
  fmt:
    name: fmt + clippy (engine)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (engine crate, warnings reported not enforced)
        run: cargo clippy --all-targets
