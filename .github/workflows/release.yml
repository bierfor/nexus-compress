name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.1). MUST match tauri.conf.json.'
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────────────────────
  #  Build the GUI bundle for macOS + Linux + Windows.
  #  Uses tauri-apps/tauri-action which handles signing
  #  (if secrets are configured), bundling (.dmg / .deb / .msi),
  #  and uploading assets to the release.
  # ─────────────────────────────────────────────────────────────
  build-gui:
    name: build ${{ matrix.platform }}
    # tauri-action needs write access to create the GitHub Release
    # and upload the bundled assets. Without this the upload step
    # aborts with `Error: GITHUB_TOKEN is required`.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS · arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS · x86_64
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            label: Linux · x86_64
          # Sprint 5.6.28 hotfix #7: bumped ubuntu-22.04 -> 24.04
          # because the latest tauri-webview2gtk-bindings
          # requires libsoup-3.0 + javascriptcoregtk-4.1 which
          # are only in Ubuntu 24.04+ main repos (Ubuntu 22.04
          # LTS only ships libsoup2.4 + javascriptcoregtk-4.0).
          # The earlier 22.04 + libsoup2.4 worked for Tauri 2.0
          # stable but breaks on Tauri 2.1+'s webview dependency.
          # Sprint 5.6.28 hotfix #6: aarch64-unknown-linux-gnu
          # (Linux ARM64) temporarily disabled. Cross-compiling
          # from the x86_64 runner needs a sysroot + pkg-config
          # configured for cross compilation, which isn't
          # installed by default and would add 5+ minutes to
          # every release build. GH Actions ships native arm64
          # runners (ubuntu-22.04-arm) but those were in beta
          # at the time of v0.1.1. Linux/arm64 users can build
          # from source or wait for v0.1.2.
          # - platform: ubuntu-24.04
          #   target: aarch64-unknown-linux-gnu
          #   label: Linux · arm64 (disabled per hotfix #6)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows · x86_64
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/Library/Caches/cargo
            src-tauri/target
            C:\Users\runneradmin\.cargo\registry
            src-tauri\target
          # Sprint 5.6.28 hotfix #11: include src-tauri/tauri.conf.json
          # + src-tauri/icons/ in the cache key. tauri-build
          # watches tauri.conf.json for changes but cargo's
          # cache key doesn't track that file by default —
          # only Cargo.lock + Cargo.toml. Without this, when
          # you add icons (e.g. icon.ico for Windows), the
          # cache hits the OLD build-script output that says
          # "icons/icon.ico not found" and the build fails
          # even though the file exists in HEAD.
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock', '**/src-tauri/Cargo.toml', '**/src-tauri/tauri.conf.json', '**/src-tauri/icons/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      # ─── macOS prerequisites
      - name: Install macOS deps
        if: matrix.platform == 'macos-latest'
        run: |
          brew install create-dmg

      # ─── Linux prerequisites
      # Sprint 5.6.28 hotfix #7: bumped to libsoup-3.0 +
      # webkit2gtk-4.1 (the modern Tauri 2.x webview chain
      # used on Noble+). The 22.04 packages (libsoup2.4 +
      # webkit2gtk-4.0) fail to build tauri-webview2gtk-bindings.
      - name: Install Linux deps (Tauri 2.1+ system libs)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libavahi-client-dev \
            libsecret-1-dev \
            libfuse2

      # ─── Windows prerequisites (WIX for MSI bundling)
      - name: Install WIX (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # Tauri's setup action installs the WiX toolset as needed.

      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Frontend · install + build (pnpm)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # Sprint 5.6.29 hotfix #17: tauri-bundler's
      # `var_os("APPLE_CERTIFICATE")` returns Some("") for empty
      # strings (NOT None), so passing the cert as an empty env var
      # still enters the import path. The only way to skip the import
      # entirely is to UNSET the env var when the password is missing.
      # Same for WINDOWS_CERTIFICATE.
      - name: Sanitize Apple/Windows cert env vars
        # runner.os is always lowercase: "macos" (NOT "macOS"),
        # "windows", "linux". Using capital-S "macOS" silently
        # skips this step on every macOS runner — which is why
        # the codesign cert with empty password was being passed
        # to `security import` in v0.1.1 release #28946151096.
        if: runner.os == 'macos' || runner.os == 'windows'
        shell: bash
        run: |
          # If APPLE_CERTIFICATE_PASSWORD is unset/empty but the cert
          # is set, drop the cert env vars entirely so tauri-bundler
          # skips the sign step (gatekeeper warns but binary runs).
          if [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ] && [ -n "${APPLE_CERTIFICATE:-}" ]; then
            echo "::warning::APPLE_CERTIFICATE_PASSWORD is empty; unsetting cert env vars to skip macOS codesign"
            unset APPLE_CERTIFICATE
            unset APPLE_CERTIFICATE_PASSWORD
            unset APPLE_SIGNING_IDENTITY
          fi
          if [ -z "${WINDOWS_CERTIFICATE_PASSWORD:-}" ] && [ -n "${WINDOWS_CERTIFICATE:-}" ]; then
            echo "::warning::WINDOWS_CERTIFICATE_PASSWORD is empty; unsetting cert env vars to skip Windows codesign"
            unset WINDOWS_CERTIFICATE
            unset WINDOWS_CERTIFICATE_PASSWORD
          fi
          # Persist the unsets into the next step's env via GITHUB_ENV.
          # (The unset above only affects this subshell; we need to
          # actually rewrite the env for tauri-action.)
          {
            echo "APPLE_CERTIFICATE=${APPLE_CERTIFICATE:-}"
            echo "APPLE_CERTIFICATE_PASSWORD=${APPLE_CERTIFICATE_PASSWORD:-}"
            echo "APPLE_SIGNING_IDENTITY=${APPLE_SIGNING_IDENTITY:-}"
            echo "WINDOWS_CERTIFICATE=${WINDOWS_CERTIFICATE:-}"
            echo "WINDOWS_CERTIFICATE_PASSWORD=${WINDOWS_CERTIFICATE_PASSWORD:-}"
          } >> "$GITHUB_ENV"

      - name: Tauri · bundle via tauri-action
        # Sprint 5.6.29 hotfix #17: see the "Sanitize Apple/Windows
        # cert env vars" pre-step above — it unsets the cert env vars
        # entirely when the password is empty, so tauri-bundler's
        # `var_os("APPLE_CERTIFICATE")` returns None and the import
        # path is skipped.
        uses: tauri-apps/tauri-action@v0
        env:
          # tauri-action needs GITHUB_TOKEN to create the draft release
          # and upload bundled assets. Auto-provided by GitHub Actions
          # when the job has `permissions: contents: write`.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing secrets (configured in repo Settings → Secrets).
          # If unset, the action produces an unsigned build (still OK
          # for CI sanity checks, but won't ship to end users).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS codesign + notarise (see hotfix #17 comment above).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows codesign (only inject when password is present).
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          # Sprint 5.6.28 hotfix #4: explicitly point at the
          # actual Tauri project dir. Without this tauri-cli
          # walks up the directory tree from the CWD and
          # finds a STALE repo-root tauri.conf.json (was
          # checked in accidentally, pointed to ./ui instead
          # of ./frontend/out). The root project has been
          # src-tauri/ since Sprint 5.5.
          projectPath: src-tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          releaseName: "NexusRAR ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}"
          releaseBody: "Automated release — see CHANGELOG.md."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --verbose

      - name: Upload to workflow artifacts (fallback when no release)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: nexus-rar-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**
            src-tauri/target/${{ matrix.target }}/release/${{ matrix.target == 'x86_64-pc-windows-msvc' && 'nexus-rar.exe' || 'nexus-rar' }}
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  #  Engine binaries (CLI only — for users who want compression
  #  without the GUI). Single artifact per platform/arch.
  # ─────────────────────────────────────────────────────────────
  build-engine:
    name: engine · ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        # Sprint 5.6.28 hotfix #6: aarch64-unknown-linux-gnu
        # disabled pending native arm64 runner support on
        # GH Actions.
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
    runs-on: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'ubuntu-24.04' ||
                 matrix.target == 'x86_64-apple-darwin' && 'macos-latest' ||
                 matrix.target == 'aarch64-apple-darwin' && 'macos-latest' ||
                 'windows-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/Library/Caches/cargo
            src-tauri/target
            C:\Users\runneradmin\.cargo\registry
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
             ${{ matrix.target }}-cargo-

      # Sprint 5.6.28 hotfix #8: build-engine compiles
      # p2p_smoke which lives in src-tauri and pulls in
      # tauri → gtk-3. Without these apt packages the build
      # fails on gdk-sys / glib-sys / libsoup-3 etc.
      - name: Install Linux Tauri 2 system libs
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libavahi-client-dev \
            libsecret-1-dev

      - name: cargo build --release
        run: |
          # Sprint 5.6.28 hotfix #5: --package nexus-compress
          # restricts compilation to just the engine crate,
          # not the workspace. p2p_smoke (built below) lives
          # in src-tauri and is built separately.
          cargo build --release --package nexus-compress --target ${{ matrix.target }} --bin nexus
          (cd src-tauri && cargo build --release --target ${{ matrix.target }} --bin p2p_smoke)

      - name: Test (where Linux is fastest)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          # Sprint 5.6.28 hotfix #8: install GTK system libs here
          # too — we also compile p2p_smoke which lives in
          # src-tauri and pulls in tauri → gtk-3.
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libavahi-client-dev \
            libsecret-1-dev
          cargo test --release --bins
          (cd src-tauri && cargo test --release --bin p2p_smoke)

      - name: Package engine binary (Linux/macOS — bash + zip)
        if: matrix.target != 'x86_64-pc-windows-msvc'
        run: |
          suffix="${{ matrix.target }}"
          binary="nexus"
          smoke="p2p_smoke"
          dir="engine-${suffix}"
          mkdir -p "$dir"
          # Debug: list what cargo actually produced.
          echo "=== root target/${suffix}/release/ ==="
          ls -la "target/${suffix}/release/" 2>&1 | head -20 || echo "  (missing)"
          echo "=== src-tauri/target/${suffix}/release/ ==="
          ls -la "src-tauri/target/${suffix}/release/" 2>&1 | head -20 || echo "  (missing)"
          echo "=== src-tauri/target/release/ ==="
          ls -la "src-tauri/target/release/" 2>&1 | head -20 || echo "  (missing)"
          # Copy the actual binary wherever cargo put it.
          if [ -f "target/${suffix}/release/${binary}" ]; then
            cp "target/${suffix}/release/${binary}" "$dir/"
          else
            echo "::error::${binary} not found at target/${suffix}/release/${binary}"
            exit 1
          fi
          # p2p_smoke lives in src-tauri/ but the workspace target
          # dir is at the repo root, so binaries end up at:
          #   1) target/${suffix}/release/${smoke}   ← workspace root, --target build
          #   2) target/release/${smoke}             ← workspace root, host-triple build
          #   3) src-tauri/target/${suffix}/release/ ← legacy (per-crate target)
          #   4) src-tauri/target/release/           ← legacy (per-crate, host-triple)
          # Try all four in order.
          if [ -f "target/${suffix}/release/${smoke}" ]; then
            cp "target/${suffix}/release/${smoke}" "$dir/"
          elif [ -f "target/release/${smoke}" ]; then
            cp "target/release/${smoke}" "$dir/"
            echo "::notice::p2p_smoke was found at host-triple path (target/release/)"
          elif [ -f "src-tauri/target/${suffix}/release/${smoke}" ]; then
            cp "src-tauri/target/${suffix}/release/${smoke}" "$dir/"
            echo "::notice::p2p_smoke was found at src-tauri/target/${suffix}/release/"
          elif [ -f "src-tauri/target/release/${smoke}" ]; then
            cp "src-tauri/target/release/${smoke}" "$dir/"
            echo "::notice::p2p_smoke was found at src-tauri/target/release/ (host-triple)"
          else
            echo "::error::${smoke} not found under target/ or src-tauri/target/"
            exit 1
          fi
          if [ -f LICENSE ]; then cp LICENSE "$dir/"; fi
          if [ -f README.md ]; then cp README.md "$dir/"; fi
          (cd "$dir" && zip -r "../${dir}.zip" .)
          rm -rf "$dir"

      - name: Package engine binary (Windows — PowerShell)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $suffix = "${{ matrix.target }}"
          $binary = 'nexus.exe'
          $smoke  = 'p2p_smoke.exe'
          $dir = "engine-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          # Debug: list what cargo actually produced.
          Write-Host "=== root target/$suffix/release/ ==="
          if (Test-Path "target/$suffix/release/") { Get-ChildItem "target/$suffix/release/" | Select-Object -First 20 }
          Write-Host "=== src-tauri/target/$suffix/release/ ==="
          if (Test-Path "src-tauri/target/$suffix/release/") { Get-ChildItem "src-tauri/target/$suffix/release/" | Select-Object -First 20 }
          Write-Host "=== src-tauri/target/release/ ==="
          if (Test-Path "src-tauri/target/release/") { Get-ChildItem "src-tauri/target/release/" | Select-Object -First 20 }
          Copy-Item "target/${{ matrix.target }}/release/$binary" "$dir/$binary"
          # p2p_smoke lives in src-tauri/ but the workspace target
          # dir is at the repo root, so binaries end up at:
          #   1) target/${{ matrix.target }}/release/$smoke   ← workspace root, --target build
          #   2) target/release/$smoke                         ← workspace root, host-triple build
          #   3) src-tauri/target/${{ matrix.target }}/release/$smoke ← legacy
          #   4) src-tauri/target/release/$smoke               ← legacy
          if (Test-Path "target/${{ matrix.target }}/release/$smoke") {
            Copy-Item "target/${{ matrix.target }}/release/$smoke" "$dir/$smoke"
          } elseif (Test-Path "target/release/$smoke") {
            Copy-Item "target/release/$smoke" "$dir/$smoke"
            Write-Host "::notice::p2p_smoke was found at host-triple path (target/release/)"
          } elseif (Test-Path "src-tauri/target/${{ matrix.target }}/release/$smoke") {
            Copy-Item "src-tauri/target/${{ matrix.target }}/release/$smoke" "$dir/$smoke"
            Write-Host "::notice::p2p_smoke was found at src-tauri/target/${{ matrix.target }}/release/"
          } elseif (Test-Path "src-tauri/target/release/$smoke") {
            Copy-Item "src-tauri/target/release/$smoke" "$dir/$smoke"
            Write-Host "::notice::p2p_smoke was found at src-tauri/target/release/ (host-triple)"
          } else {
            Write-Host "::error::$smoke not found under target/ or src-tauri/target/"
            exit 1
          }
          if (Test-Path "LICENSE") { Copy-Item LICENSE "$dir/LICENSE" }
          if (Test-Path "README.md") { Copy-Item README.md "$dir/README.md" }
          Compress-Archive -Path "$dir/*" -DestinationPath "$dir.zip"

      - name: Upload engine archive
        uses: actions/upload-artifact@v4
        with:
          name: nexus-engine-${{ matrix.target }}
          path: engine-${{ matrix.target }}.zip
          if-no-files-found: ignore
