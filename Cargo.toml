[package]
name = "nexus-compress"
version = "0.1.1"
edition = "2021"
description = "NexusCompress - hybrid compressor (LZ77 + rANS + dict codec)"
license = "MIT"

[lib]
name = "nexus_compress"
path = "src/lib.rs"

[dependencies]
rans = "0.4"
serde = { version = "1", features = ["derive"] }
# v5 LZMA backend. xz2 wraps liblzma (compiled from C source via
# xz-sys), battle-tested by every Linux distro and used by `xz`.
# Pure-Rust alternative would be `xz = "0.4"`.
xz2 = "0.1"
# v6 AST minifier. swc_core is the meta-crate that unifies the
# swc_ecma_parser / swc_ecma_codegen / swc_ecma_ast sub-crates
# under a single versioned release family. Using the meta-crate
# avoids the "Node trait not implemented" errors that happen when
# mixing different major versions of the individual crates.
# We need parser + codegen + the transforms base (for visitors
# like FoldWith that we'll use for the mangle pass in Phase 2).
swc_core = { version = "72", features = ["ecma_parser", "ecma_codegen", "ecma_transforms", "common", "ecma_ast"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[[bin]]
name = "nexus"
path = "src/main.rs"

[[bin]]
name = "bench_suite"
path = "src/bin/bench_suite.rs"

[[bin]]
name = "dict_train"
path = "src/bin/dict_train.rs"

[[bin]]
name = "dict_smoke"
path = "src/bin/dict_smoke.rs"

[[bin]]
name = "dict_compare"
path = "src/bin/dict_compare.rs"

# The Tauri-based GUI lives in `src-tauri/` (a separate Cargo
# package that depends on this crate by path). This keeps the
# webview deps out of the lib build, and matches the standard
# Tauri 2.x project layout. To build the GUI:
#
#   cd src-tauri && cargo build --release
#
# To run the dev loop (Tauri + Next.js hot reload):
#
#   cd src-tauri && cargo tauri dev
#

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
