[workspace]
# Sprint 5.6.28: root Cargo.toml was a single-package crate
# (engine only) before. The Tauri GUI lives in src-tauri/ as
# a separate crate that depends on this one by `path = "."`.
# `tauri-action`'s build step runs `cargo tauri build` from
# the repo root and expects to find the Tauri crate as a
# workspace member. Without this, you get:
#
#   failed to find main binary, make sure you have a
#   `package > default-run` in the Cargo.toml file
#
# Solution: declare src-tauri/ as the workspace's Tauri member
# while keeping the engine crate (this file) as the workspace
# root for cargo CLI ergonomics.
members = ["src-tauri"]
resolver = "2"

[package]
name = "nexus-compress"
version = "0.1.2"
edition = "2021"
description = "NexusCompress - hybrid compressor (LZ77 + rANS + dict codec)"
# SPRINT 5.6.28: changed from `MIT` to `AGPL-3.0 + Commercial`.
# The project's dual-license model lives in LICENSE and
# COMMERCIAL-LICENSE.md at the repo root; this is the SPDX
# identifier that GitHub + cargo metadata pick up.
license = "AGPL-3.0-or-later"

[lib]
name = "nexus_compress"
path = "src/lib.rs"

[dependencies]
rans = "0.4"
serde = { version = "1", features = ["derive"] }
# Sprint 5.7 hotfix #21: RAM auto-tune for the LZMA dictionary size.
# Pure-Rust, ~no-deps, ~1 ms on first call (cached by the OS page-cache
# after that). We only need the system's available memory at compress
# start — sysinfo's System::available_memory() does exactly that on
# macOS / Windows / Linux without shelling out to `sysctl`/`wmic`.
sysinfo = "0.32"
# Sprint 5.7.1: cross-platform FS trait in src/fs.rs.
# - filetime: portable mtime setter (no std equivalent)
# - xattr: Unix extended-attribute read/write. Sprint 5.7.1
#   hotfix #21: moved to a [target.'cfg(unix)'.dependencies]
#   table below because the xattr 1.6 crate fails to compile
#   on `x86_64-pc-windows-msvc` with `error[E0433]: cannot find
#   'unix' in 'os'` from xattr's own `src/sys/unsupported.rs`
#   (it uses `use std::os::unix::io::BorrowedFd;` even in the
#   `unsupported` cfg path, which is broken on newer Rust
#   toolchains — Windows CI on Rust 1.83+ hits this). The
#   `fs-xattr` feature is still exposed for opt-in testing on
#   Unix, but no longer included in the `default` feature set
#   (Unix-only by being declared in the target-cfg block).
# - fs2: Windows disk-free-space query (optional feature gate;
#   defaults to "unknown" if not enabled)
filetime = "0.2"
# NOTE: `xattr` is declared ONLY in the [target.'cfg(unix)'.dependencies]
# block at the bottom of this file. It used to be here as
# `xattr = { version = "1", optional = true }` but that caused
# Windows CI to fail with `cannot find 'unix' in 'os'`. The
# `fs-xattr` feature still works via `dep:xattr` even with
# the Unix-only declaration.
fs2 = { version = "0.4", optional = true }
# Sprint 5.7.1: libc for the statvfs + chown FFI in UnixFs.
# Already a transitive dep via sysinfo; pinning 0.2 explicitly so
# the FFI signatures match the unix crate family.
libc = "0.2"
# Sprint 5.7.2: AES-256-GCM block cipher + Argon2id KDF.
# - aes-gcm 0.10: the RustCrypto implementation of AES-GCM.
#   Pinned to 0.10 because the API (Aes256Gcm::new + aead::Payload
#   for AAD) is what the design doc §2 commits to.
# - aead 0.5: the trait abstraction that aes-gcm implements.
# - argon2 0.5: the RustCrypto implementation of Argon2id
#   (the recommended KDF for new applications per OWASP).
#   Already vetted by the p2p_tunnel module in this same crate.
# - zeroize 1: drops in-memory secrets to zero on Drop. The
#   crate's `Zeroizing<T>` wrapper is the standard pattern
#   for AES key material. Replaces our hand-rolled
#   `write_volatile(0)` loop in ZeroizingKey.
aes-gcm = "0.10"
aead = "0.5"
argon2 = "0.5"
getrandom = "0.2"
thiserror = "1"
rayon = "1.10"
zeroize = { version = "1", features = ["zeroize_derive"] }
# v5 LZMA backend. xz2 wraps liblzma (compiled from C source via
# xz-sys), battle-tested by every Linux distro and used by `xz`.
# Pure-Rust alternative would be `xz = "0.4"`.
xz2 = "0.1"
# Sprint 5.7.2 hotfix #32: zstd for fast V6Solid encoding.
# zstd ~300-500 MB/s on Apple Silicon vs LZMA9 ~20-50 MB/s.
# Streaming API supports concatenated frames (multi-chunk = no problem).
# `zdict_builder` feature enables dictionary training (from_samples, etc.).
zstd = { version = "0.13", features = ["zdict_builder"] }
# v6 AST minifier. swc_core is the meta-crate that unifies the
# swc_ecma_parser / swc_ecma_codegen / swc_ecma_ast sub-crates
# under a single versioned release family. Using the meta-crate
# avoids the "Node trait not implemented" errors that happen when
# mixing different major versions of the individual crates.
# We need parser + codegen + the transforms base (for visitors
# like FoldWith that we'll use for the mangle pass in Phase 2).
swc_core = { version = "72", features = ["ecma_parser", "ecma_codegen", "ecma_transforms", "common", "ecma_ast"] }

[dev-dependencies]
serde_json = "1"
# Sprint 5.7.1: re-add tempfile. The dep was lost at some point
# (probably during a previous merge conflict) but tests in
# src/nxar.rs still use `tempfile::TempDir`. Without this the
# test target fails to compile even though the lib target builds
# clean. Adding it back is a no-op for the runtime (dev-dep only).
tempfile = "3"
# Sprint 5.7.5: zip-format-coverage tests in src/solid_archive.rs
# use the `zip` crate to build minimal but real OOXML/ODF/iWork
# files (docx, xlsx, pptx, epub, pages, etc.) so the format
# roundtrip tests exercise the actual zip central directory
# instead of stub bytes. The `zip` crate is dev-only.
zip = { version = "2", default-features = false, features = ["deflate"] }

# Sprint 5.7.1 hotfix #21: pull `xattr` ONLY on Unix targets.
# Declared as `optional = true` here so the `fs-xattr` feature
# in the [features] block above (via `dep:xattr`) still works
# for opt-in testing on Unix. Windows / WASM targets won't
# pull in the xattr crate at all because this block is gated
# by `cfg(unix)`. Without this, `cargo build --target
# x86_64-pc-windows-msvc` fails with `cannot find 'unix' in 'os'`
# from xattr's own `src/sys/unsupported.rs` (the crate's Windows
# stub still references `std::os::unix::io::BorrowedFd`, which
# is broken on newer Rust toolchains).
[target.'cfg(unix)'.dependencies]
xattr = { version = "1", optional = true }

# Sprint 5.7.1: optional cross-platform FS support. The
# `fs-xattr` feature is Unix-only by being declared in the
# `[target.'cfg(unix)'.dependencies]` block above; it's NOT in
# the `default` feature set so Windows users won't try to
# compile the xattr crate (which fails on
# x86_64-pc-windows-msvc with `cannot find 'unix' in 'os'`).
# CI can disable these individually via `--no-default-features`
# to test the `StdFs` fallback path.
[features]
default = ["fs-disk-free"]
# Linux + macOS extended attributes (preserves quarantine / SELinux
# labels on archive round-trip). Unix-only because the underlying
# xattr crate doesn't compile on Windows; pulled in via the
# `[target.'cfg(unix)'.dependencies]` table above.
fs-xattr = ["dep:xattr"]
# Windows disk-free-space query (faster than statvfs equivalent).
fs-disk-free = ["dep:fs2"]

[[bin]]
name = "nexus"
path = "src/main.rs"

[[bin]]
name = "bench_suite"
path = "src/bin/bench_suite.rs"

[[bin]]
name = "dict_train"
path = "src/bin/dict_train.rs"

[[bin]]
name = "dict_smoke"
path = "src/bin/dict_smoke.rs"

[[bin]]
name = "dict_compare"
path = "src/bin/dict_compare.rs"

# The Tauri-based GUI lives in `src-tauri/` (a separate Cargo
# package that depends on this crate by path). This keeps the
# webview deps out of the lib build, and matches the standard
# Tauri 2.x project layout. To build the GUI:
#
#   cd src-tauri && cargo build --release
#
# To run the dev loop (Tauri + Next.js hot reload):
#
#   cd src-tauri && cargo tauri dev
#

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
