[package]
name = "nexus-compress"
version = "0.1.0"
edition = "2021"
description = "NexusCompress - hybrid compressor (LZ77 + CM + rANS) with Tauri UI"
license = "MIT"

[lib]
name = "nexus_compress"
path = "src/lib.rs"

[dependencies]
rans = "0.4"
serde = { version = "1", features = ["derive"] }
# Tauri 2.x — only required for the `nexus-rar` binary. The lib
# doesn't depend on Tauri (see [features] below).
tauri = { version = "2", optional = true }

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "nexus"
path = "src/main.rs"

[[bin]]
name = "corpus_suite"
path = "src/bin/corpus_suite.rs"

[[bin]]
name = "nexus-rar"
path = "src/tauri_app.rs"
required-features = ["tauri-app"]

[features]
# Enables the Tauri-based GUI (`nexus-rar` binary). Off by default so
# the lib + CLI binaries don't pull in webview/webview2/wkwebview deps.
default = []
tauri-app = ["dep:tauri"]

[build-dependencies]
# Required for the `nexus-rar` binary. Always-on (not feature-gated)
# because Cargo's build-dependency resolution doesn't see the
# package features during the build-script phase — gating it
# would fail the build of the other binaries.
tauri-build = { version = "2", default-features = false }

[[bench]]
name = "bench"
path = "benches/bench.rs"
harness = false

[[example]]
name = "inspect_cdc"
path = "examples/inspect_cdc.rs"

[[example]]
name = "cdc_sweep"
path = "examples/cdc_sweep.rs"

[[example]]
name = "debug_optimal"
path = "examples/debug_optimal.rs"

[[example]]
name = "debug_basic"
path = "examples/debug_basic.rs"

[[example]]
name = "debug_real"
path = "examples/debug_real.rs"

[[example]]
name = "debug_codec"
path = "examples/debug_codec.rs"

[[example]]
name = "debug_lazy_vs_opt"
path = "examples/debug_lazy_vs_opt.rs"

[[example]]
name = "inspect_entropy"
path = "examples/inspect_entropy.rs"

[[example]]
name = "debug_v3"
path = "examples/debug_v3.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
