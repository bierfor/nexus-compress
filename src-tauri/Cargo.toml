[package]
name = "nexus-rar"
version = "0.1.0"
edition = "2021"
description = "NexusRAR — Tauri 2.x desktop GUI for NexusCompress"
license = "MIT"
default-run = "nexus-rar"

# The library is consumed by path: the engine is in the workspace
# root (`../`), so `nexus-compress` resolves to the existing crate
# without duplication. Any local change to the engine is picked up
# by `cargo build -p nexus-rar` automatically.
[dependencies]
nexus-compress = { path = "..", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Sprint 5.0 — P2P tunnel (Quick Cloudflare) + Argon2id + SPAKE2 + AES-GCM
spake2 = "0.4"        # SPAKE2 password-authenticated key exchange
aes-gcm = "0.10"      # AES-256-GCM chunked authenticated encryption
argon2 = "0.5"        # Argon2id passphrase stretching (modest profile)
zeroize = { version = "1.7", features = ["zeroize_derive"] } # secure memory wipe
axum = { version = "0.7", features = ["http2"] } # local HTTP server (SPAKE2 endpoints)
http-body-util = "0.1"        # chunked streaming response bodies
regex = "1"                   # parse cloudflared stderr for the trycloudflare URL
rand = "0.8"                  # SP-style nonce, cloudflared-port pick
base64 = "0.22"               # P2pToken encoding
thiserror = "1"               # ergonomic error types
bytes = "1"                   # for axum::body::Body::from_stream frames
futures-util = "0.3"          # stream::unfold for chunked file encryption
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Crypto building blocks (re-declared because the src-tauri crate
# is a separate compilation unit from the parent nexus-compress).
keyring = { version = "2.3", features = ["security-framework", "winapi", "secret-service"] } # OS-native secret storage (Keychain/Credential Mgr/Secret Service)
hex = "0.4"                   # hex::encode / hex::decode for SHA-256 + filename hash
sha2 = "0.10"                 # SHA-256 (keyed)
hkdf = "0.12"                 # HKDF-SHA256 for session key derivation
hmac = "0.12"                 # HMAC-SHA256 challenge-response auth header
tokio = { version = "1", features = ["full"] }
flate2 = "1"                  # gzip decompression for cloudflared .tgz
tar = "0.4"                   # tar extraction for cloudflared tarball
# The `custom-protocol` feature activates production mode: instead
# of fetching from `devUrl`, the `frontendDist` directory is embedded
# into the binary at compile time. Without this, the Tauri build
# script sets `dev = true` and the app tries to load from the dev
# server, which doesn't exist when running the release binary
# directly. This is the single most-baffling Tauri 2.x config.
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"

[build-dependencies]
tauri-build = { version = "2", features = ["codegen"] }

[features]
# Default feature is empty: the binary builds without Tauri (for
# `cargo check` on the lib side). The GUI is opt-in.
default = []
tauri-app = []  # marker feature; kept for forward compat

# Sprint 5.0 — P2P field-test binary. Compiled with
# `cargo build --release --bin p2p_smoke`. Uses the same
# p2p_tunnel module as the GUI but is a standalone CLI for
# measuring handshake latency, throughput, and drop behavior
# against the real Cloudflare Quick Tunnel.
[[bin]]
name = "nexus-rar"
path = "src/main.rs"

[[bin]]
name = "p2p_smoke"
path = "src/bin/p2p_smoke.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
